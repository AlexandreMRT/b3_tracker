[project]
name = "b3-tracker"
version = "1.0.0"
description = "Brazilian stock market tracker with technical analysis, news sentiment, and portfolio management"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (no DB, no network)",
    "integration: Integration tests (requires DB)",
    "slow: Slow tests (external API calls)",
]
# Allow importing from src/
pythonpath = ["src"]
filterwarnings = [
    "error::DeprecationWarning",           # treat our own deprecation warnings as errors
    "ignore::DeprecationWarning:jose",     # python-jose uses datetime.utcnow() internally
    "ignore::DeprecationWarning:sqlalchemy.sql.schema",  # SQLAlchemy default= callable inspection
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/test_multiuser.py",
    "src/__pycache__/*",
    "src/main.py",
    "src/scheduler.py",
    "src/exporter.py",
    "src/polymarket.py",
    "src/logger.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "pass",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "UP007",  # use X | Y for union types (keep Optional for readability)
    "UP006",  # use dict/list instead of Dict/List (keep for consistency with existing code)
    "UP017",  # use datetime.UTC alias (timezone.utc is more explicit and portable)
    "UP035",  # typing.Dict deprecated (same as UP006, keep for consistency)
    "UP045",  # use X | None instead of Optional (keep Optional for readability)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F811"]  # import order & redefined names in test fixtures
"tests/conftest.py" = ["E402", "F811", "I001"]  # intentional import ordering for env setup
"src/test_multiuser.py" = ["ALL"]  # legacy manual test script

[tool.ruff.lint.isort]
known-first-party = [
    "api", "auth", "database", "exporter", "fetcher",
    "logger", "models", "polymarket", "portfolio",
    "scheduler", "scoring", "signals", "users",
]
